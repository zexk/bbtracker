name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      - name: Build and test
        run: |
          nix flake check -L
          nix build -L
          nix build -L .#mgs4-stage-selector -o result-stage-selector

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp result/bin/bbtracker_*.asi dist/
          cp result-stage-selector/* dist/
          cd dist
          python3 -m zipfile -c "bbtracker-${VERSION}.zip" bbtracker_*.asi
          for asi in bbtracker_*.asi; do
            game="${asi#bbtracker_}"
            python3 -m zipfile -c "bbtracker-${game%.asi}-${VERSION}.zip" "$asi"
          done
          python3 -m zipfile -c "mgs4-stage-selector-${VERSION}.zip" \
            launcher.exe mgs4_stage_selector.asi mgs4-stage-selector.ini README.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.zip
