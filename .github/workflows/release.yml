name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      - name: Build and test
        run: |
          nix flake check -L
          nix build -L
          nix build -L .#mgs4-stage-selector -o result-stage-selector

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          echo "NEXUS_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          mkdir dist
          cp result/bin/bbtracker_*.asi dist/
          cp result-stage-selector/* dist/
          cd dist
          python3 -m zipfile -c "bbtracker-${VERSION}.zip" bbtracker_*.asi
          for asi in bbtracker_*.asi; do
            game="${asi#bbtracker_}"
            python3 -m zipfile -c "bbtracker-${game%.asi}-${VERSION}.zip" "$asi"
          done
          python3 -m zipfile -c "mgs4-stage-selector-${VERSION}.zip" \
            launcher.exe mgs4_stage_selector.asi mgs4-stage-selector.ini README.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.zip

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: dist/bbtracker-${{ github.ref_name }}.zip
          version: ${{ env.NEXUS_VERSION }}
          archive_existing_version: true
          update_mod_version: true
