name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      - name: Build and test
        run: |
          nix flake check -L
          nix build -L

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp result/bin/bbtracker_{mg12,mgs1,mgs2,mgs3}.asi dist/
          cd dist
          python3 -m zipfile -c "bbtracker-${VERSION}.zip" ./*.asi
          for game in mg12 mgs1 mgs2 mgs3; do
            python3 -m zipfile -c "bbtracker-${game}-${VERSION}.zip" "bbtracker_${game}.asi"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.zip
