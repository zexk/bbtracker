[overlay]
; Uncomment both values in a pair to override default left-center placement
; or automatic size. Values are back-buffer pixels.
; x=16
; y=300
; width=360
; height=480

; show_on_start=1
; Range: 50-300
; scale_percent=100
; Range: 0-100
; opacity_percent=80
; Range: 80-2160 back-buffer pixels
; max_list_height=360

; Keys accept F1-F24, arrows, Home, End, PageUp, PageDown, Insert, Delete,
; Space, Tab, Enter, Escape, a single letter/number, or a Win32 virtual-key value.
; toggle_key=F3
; tab_key=F4
; scroll_up_key=UP
; scroll_down_key=DOWN

; Enables cursor, clickable tabs, title-bar close/move, and resize grip.
; mouse=0

[diagnostics]
; off, error, warn, info, or debug
; log_level=info
